<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
 
  <body>
    <div id="nc-root"></div>
 
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/subcategories.js"></script>
 
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
 
      const DependentSelectControl = createClass({
  render: function() {
    const { value, forID, classNameWrapper, entry, onChange } = this.props;
    
    // This line converts the Immutable object to a regular JS object
    // so you can see EVERYTHING in the console.
    const entryData = entry.get('data').toJS();
    console.log("FULL ENTRY DATA:", entryData);

    // Change 'category' to whatever the console shows as the key name
    const category = entryData['category']; 
    
    const options = (category && SUBCATEGORIES[category]) ? SUBCATEGORIES[category] : [];

    return h('div', { className: classNameWrapper }, [
      h('select', {
        id: forID,
        value: value || '',
        onChange: (e) => onChange(e.target.value),
        style: { width: '100%', padding: '10px' }
      }, [
        h('option', { value: '' }, '— Изберете подкатегория —'),
        ...options.map(opt => h('option', { value: opt, key: opt }, opt))
      ]),
      // This helper text will show you the "active" category in the UI for testing
      h('p', { style: { fontSize: '12px', color: 'red' } }, `Debug: Текуща категория е "${category}"`)
    ]);
  }
});
 
      const DependentSelectPreview = createClass({
        render() {
          return h('span', {}, this.props.value || '');
        }
      });
 
      CMS.registerWidget(
        'dependent-select',
        DependentSelectControl,
        DependentSelectPreview
      );
    </script>
  </body>
</html>
