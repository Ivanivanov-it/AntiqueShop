<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
 
  <body>
    <div id="nc-root"></div>
 
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/subcategories.js"></script>
 
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
 
     const DependentSelectControl = createClass({
  render: function() {
    const { value, forID, classNameWrapper, entry, onChange } = this.props;

    // 1. Get the raw data
    const data = entry ? entry.get('data') : null;
    
    // 2. DEBUG: Let's see what keys actually exist in your CMS right now
    if (data) {
      const keys = data.keySeq().toArray();
      console.log("FIELDS FOUND IN CMS:", keys);
      
      // We will try to find 'category' regardless of case
      var categoryKey = keys.find(k => k.toLowerCase() === 'category');
      var category = data.get(categoryKey);
      console.log("Selected Category Value:", category);
    }

    const options = (category && SUBCATEGORIES[category]) ? SUBCATEGORIES[category] : [];

    // UI Logic
    if (!category) {
      return h('div', { className: classNameWrapper, style: { padding: '10px', color: '#888', border: '1px solid #ccc', borderRadius: '4px' } }, 
        '← Моля, изберете категория горе'
      );
    }

    return h('select', {
      id: forID,
      className: classNameWrapper,
      value: value || '',
      onChange: (e) => onChange(e.target.value),
      style: { width: '100%', padding: '10px', borderRadius: '4px', border: '1px solid #dfdfe3' }
    }, [
      h('option', { value: '', key: 'placeholder' }, '— Изберете подкатегория —'),
      ...options.map(opt => h('option', { value: opt, key: opt }, opt))
    ]);
  }
});
 
      const DependentSelectPreview = createClass({
        render() {
          return h('span', {}, this.props.value || '');
        }
      });
 
      CMS.registerWidget(
        'dependent-select',
        DependentSelectControl,
        DependentSelectPreview
      );
    </script>
  </body>
</html>
