<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
 
  <body>
    <div id="nc-root"></div>
 
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/subcategories.js"></script>
 
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
 
     const DependentSelectControl = createClass({
  render: function() {
    const { value, forID, classNameWrapper, onChange } = this.props;

    // 1. TRY MULTIPLE WAYS TO FIND THE DATA
    // Way A: The standard Decap path
    let category = this.props.entry.getIn(['data', 'category']);
    
    // Way B: The "dirty" state path (often used in v3.x)
    if (!category) {
      const allValues = this.props.entry.get('data').toJS();
      category = allValues['category'];
    }

    // DEBUG: This will tell us if Way B worked
    console.log("Searching for category... Found:", category);

    // 2. Match the subcategories
    const options = (category && SUBCATEGORIES[category]) ? SUBCATEGORIES[category] : [];

    // 3. UI logic
    if (!category) {
      return h('div', { 
        className: classNameWrapper, 
        style: { padding: '10px', color: '#798291', border: '1px solid #dfdfe3', borderRadius: '4px', backgroundColor: '#fcfcfc' } 
      }, '← Моля, изберете категория горе...');
    }

    // 4. The Select Dropdown
    return h('select', {
      id: forID,
      className: classNameWrapper,
      value: value || '',
      onChange: (e) => onChange(e.target.value),
      style: { 
        width: '100%', 
        padding: '10px', 
        borderRadius: '4px', 
        border: '1px solid #dfdfe3',
        backgroundColor: '#fff'
      }
    }, [
      h('option', { value: '', key: 'placeholder' }, '— Изберете подкатегория —'),
      ...options.map(opt => h('option', { value: opt, key: opt }, opt))
    ]);
  }
});
 
      const DependentSelectPreview = createClass({
        render() {
          return h('span', {}, this.props.value || '');
        }
      });
 
      CMS.registerWidget(
        'dependent-select',
        DependentSelectControl,
        DependentSelectPreview
      );
    </script>
  </body>
</html>
