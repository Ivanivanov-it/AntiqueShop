<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
 
  <body>
    <div id="nc-root"></div>
 
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/subcategories.js"></script>
 
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
 
     const DependentSelectControl = createClass({
  render: function() {
    const { value, forID, classNameWrapper, entry, onChange } = this.props;

    // 1. Get the data. We use .get('data') and then check for 'category'
    // This is the most reliable way to pull sibling fields in Decap
    const entryData = entry ? entry.get('data') : null;
    const category = entryData ? entryData.get('category') : undefined;

    // DEBUG: This will help us see if the widget is even firing its render function
    console.log("Widget Rendered. Category found:", category);

    // 2. Match the subcategories
    const options = (category && SUBCATEGORIES[category]) ? SUBCATEGORIES[category] : [];

    // 3. UI: What to show if category isn't picked yet
    if (!category) {
      return h('div', { className: classNameWrapper, style: { color: '#798291', padding: '10px', border: '1px solid #dfdfe3', borderRadius: '4px', backgroundColor: '#f8f9fa' } }, 
        '← Моля, изберете категория горе'
      );
    }

    // 4. UI: The Dropdown
    return h('div', { className: classNameWrapper }, [
      h('select', {
        id: forID,
        value: value || '',
        onChange: (e) => onChange(e.target.value),
        style: { 
          width: '100%', 
          padding: '10px', 
          borderRadius: '4px', 
          border: '1px solid #dfdfe3',
          display: 'block'
        }
      }, [
        h('option', { value: '', key: 'placeholder' }, '— Изберете подкатегория —'),
        ...options.map(opt => h('option', { value: opt, key: opt }, opt))
      ]),
      // Small help text to show user the link is active
      options.length === 0 && h('p', { style: { margin: '5px 0 0', fontSize: '12px', color: '#e07000' } }, 
        `Забележка: "${category}" няма дефинирани подкатегории.`
      )
    ]);
  }
});
 
      const DependentSelectPreview = createClass({
        render() {
          return h('span', {}, this.props.value || '');
        }
      });
 
      CMS.registerWidget(
        'dependent-select',
        DependentSelectControl,
        DependentSelectPreview
      );
    </script>
  </body>
</html>
