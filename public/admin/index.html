    <div id="nc-root"></div>

    <script>
      (() => {
        const originalFetch = window.fetch.bind(window);
        const retryDelays = [500, 1500, 3000];
        const diagnostics = [];

        function recordDiagnostic(message) {
          const line = `${new Date().toLocaleTimeString()} ${message}`;
          diagnostics.push(line);
          diagnostics.splice(0, diagnostics.length - 8);
          window.__CMS_DIAGNOSTICS__ = diagnostics.slice();
          console.warn(line);

          const panel = document.getElementById('cms-diagnostics');
          if (panel) {
            panel.textContent = diagnostics.join('\n');
            panel.style.display = 'block';
          }
        }

        function isLocalCmsRequest(input) {
          const url = typeof input === 'string' ? input : input && input.url;
          if (!url) return false;
          return url.includes('/api/v1');
        }

        function createFetchArgs(input, init) {
          if (input instanceof Request) {
            return [input.clone(), init];
          }
          return [input, init];
        }

        async function createArchivedMediaFetchArgs(input, init) {
          try {
            const bodyText = init && init.body
              ? String(init.body)
              : input instanceof Request
                ? await input.clone().text()
                : '';

            if (!bodyText) return null;

            const body = JSON.parse(bodyText);
            const mediaPath = body && body.params && body.params.path;

            if (
              body.action !== 'getMediaFile' ||
              typeof mediaPath !== 'string' ||
              !mediaPath.startsWith('public/images/cms-uploads/')
            ) {
              return null;
            }

            const fallbackBody = JSON.stringify({
              ...body,
              params: {
                ...body.params,
                path: mediaPath.replace('public/images/cms-uploads/', 'public/images/uploads/'),
              },
            });

            if (input instanceof Request) {
              return [new Request(input, { body: fallbackBody }), init];
            }

            return [input, { ...(init || {}), body: fallbackBody }];
          } catch {
            return null;
          }
        }

        function wait(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }

        window.fetch = async function retryLocalCmsFetch(input, init) {
          if (!isLocalCmsRequest(input)) {
            return originalFetch(input, init);
          }

          let lastError;
          const archivedMediaFetchArgs = await createArchivedMediaFetchArgs(input, init);

          for (let attempt = 0; attempt <= retryDelays.length; attempt += 1) {
            try {
              const response = await originalFetch(...createFetchArgs(input, init));
              if (response.status >= 500 && archivedMediaFetchArgs) {
                const fallbackResponse = await originalFetch(...createFetchArgs(...archivedMediaFetchArgs));
                if (fallbackResponse.ok) {
                  recordDiagnostic('CMS media fallback loaded archived upload');
                  return fallbackResponse;
                }
              }

              const responseCopy = response.clone();
              responseCopy.text().then(text => {
                if (text && /"error"\s*:/.test(text)) {
                  recordDiagnostic(`CMS JSON error ${typeof input === 'string' ? input : input.url}: ${text.slice(0, 500)}`);
                }
              }).catch(() => {});

              if (response.status < 500 || attempt === retryDelays.length) {
                if (!response.ok) {
                  recordDiagnostic(`CMS ${response.status} ${response.statusText || ''} ${typeof input === 'string' ? input : input.url}`);
                }
                return response;
              }
              lastError = new Error(`CMS request failed with ${response.status}`);
              recordDiagnostic(`${lastError.message}; retry ${attempt + 1}/${retryDelays.length}`);
            } catch (error) {
              lastError = error;
              recordDiagnostic(`${error.message}; retry ${attempt + 1}/${retryDelays.length}`);
              if (attempt === retryDelays.length) {
                throw error;
              }
            }

            await wait(retryDelays[attempt]);
          }

          throw lastError;
        };
      })();
    </script>
    <pre id="cms-diagnostics" style="display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;max-height:35vh;overflow:auto;margin:0;padding:8px;background:#111;color:#fff;border-radius:4px;font:12px/1.4 monospace;white-space:pre-wrap;"></pre>

const DependentSelectControl = createClass({
  getSubcategoryOptions(category) {
    const subcategories = window.SUBCATEGORIES || {};
    const options = category ? subcategories[category] : [];
    return Array.isArray(options) ? options : [];
  },

  getInitialState() {
    // Try to get category from props immediately for Edit mode
    const initialCat = this.props.entry ? this.props.entry.getIn(['data', 'category']) : '';
    return { category: initialCat };
  },

  isValid() {
    const { value, entry } = this.props;
    
    // 1. Determine the current category by any means necessary
    // Check state, then props, then the DOM scraper
    let currentCat = this.state.category;
    if (!currentCat && entry) {
      currentCat = entry.getIn(['data', 'category']);
    }
    if (!currentCat) {
      const valueDisplay = document.querySelector('.css-hlgwow');
      currentCat = valueDisplay ? valueDisplay.innerText.trim() : '';
    }

    // 2. Check if this category requires a subcategory
    const options = this.getSubcategoryOptions(currentCat);
    const needsSubcategory = options.length > 0;

    // 3. Validation Logic
    if (needsSubcategory && (!value || value.trim() === "")) {
      return {
        error: {
          message: `Задължително: Изберете подкатегория за "${currentCat}" преди запис.`
        }
      };
    }

    return true;
  },

  componentDidMount() {
    // Flag to prevent wiping data on the initial load of the Edit page
    this.isInitialLoad = true;

    this.scraper = setInterval(() => {
      const valueDisplay = document.querySelector('.css-hlgwow');
      
      if (valueDisplay) {
        const detectedValue = valueDisplay.innerText.trim();
        
        // If the category changed from what we have in state
        if (detectedValue && detectedValue !== this.state.category) {
          
          // 1. If it's NOT the first time we're seeing this (meaning the user actually clicked)
          // OR if we are switching from one category to another
          if (!this.isInitialLoad && this.state.category !== '') {
             console.log("Category change detected! Resetting subcategory...");
             this.props.onChange(''); // This clears the old subcategory in Decap's data
          }

          // 2. Update the local state so the dropdown options change
          this.setState({ category: detectedValue });
          
          // After the first valid detection, we are no longer in "Initial Load"
          this.isInitialLoad = false;
        }
      }
    }, 300);
  },

  componentWillUnmount() {
    if (this.scraper) clearInterval(this.scraper);
  },

  render() {
    const { value, forID, classNameWrapper, onChange } = this.props;
    const category = this.state.category;
    const options = this.getSubcategoryOptions(category);
    const hasSubcategories = options.length > 0;

    return h('div', { className: classNameWrapper }, [
      h('select', {
        id: forID,
        value: value || '',
        onChange: (e) => onChange(e.target.value),
        disabled: !hasSubcategories,
        style: { 
          width: '100%', 
          padding: '10px', 
          borderRadius: '4px', 
          border: `1px solid ${hasSubcategories && !value ? '#e74c3c' : '#dfdfe3'}`,
          backgroundColor: hasSubcategories ? '#fff' : '#f0f0f0'
        }
      }, [
        h('option', { value: '' }, hasSubcategories ? `— Изберете подкатегория —` : '— Не се изисква подкатегория —'),
        ...options.map(opt => h('option', { value: opt, key: opt }, opt))
      ])
    ]);
  }
});

const DependentSelectPreview = createClass({
  render: function() {
    return h('span', {}, this.props.value || '');
  }
});

// Register the widget
CMS.registerWidget('dependent-select', DependentSelectControl, DependentSelectPreview);

const BULGARIAN_TO_LATIN = {
  а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ж: 'zh', з: 'z',
  и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p',
  р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch',
  ш: 'sh', щ: 'sht', ъ: 'a', ь: 'y', ю: 'yu', я: 'ya'
};

function createLatinSlug(value) {
  const transliterated = String(value || '')
    .toLowerCase()
    .split('')
    .map(char => BULGARIAN_TO_LATIN[char] || char)
    .join('');

  return transliterated
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-');
}

function getTodayDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}



CMS.registerEventListener({
  name: 'preSave',
  handler: ({ entry }) => {
    const data = entry.get('data');
    const title = data.get('title');
    const latinSlug = createLatinSlug(title) || `antique-${Date.now()}`;
    const images = entry.getIn(['data', 'images']);
    const date = data.get('date') || getTodayDate();

    // Check if images exists, is a list, and has at least one item with a URL
    if (!images || images.size === 0 || !images.getIn([0, 'url'])) {
      // This sends an alert to the user and stops the save process
      alert("Грешка: Трябва да добавите поне една снимка!");
      throw new Error("At least one image is required.");
    }

    return data
      .set('latinSlug', latinSlug)
      .set('date', date);
  },
});

CMS.registerEventListener({
  name: 'postSave',
  handler: () => {
    fetch('/api/cms-refresh', { method: 'POST' }).catch((error) => {
      console.warn('CMS refresh request failed', error);
    });
  },
});
