<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
 
  <body>
    <div id="nc-root"></div>
 
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/subcategories.js"></script>
 
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
 
      const DependentSelectControl = createClass({
  // We use componentDidUpdate to clear the subcategory value 
  // if the user switches to a category that doesn't match.
  componentDidUpdate(prevProps) {
    const oldCategory = prevProps.entry.getIn(['data', 'category']);
    const newCategory = this.props.entry.getIn(['data', 'category']);

    if (oldCategory !== newCategory) {
      // Reset the subcategory value in the CMS data when the parent category changes
      this.props.onChange('');
    }
  },

  render() {
    const { value, onChange, forID, classNameWrapper, entry } = this.props;
    
    // 1. Grab the current category value directly from the entry
    const category = entry.getIn(['data', 'category']);
    
    // 2. Determine options based on the current category
    const options = (category && SUBCATEGORIES[category]) ? SUBCATEGORIES[category] : [];

    // 3. UI logic for when no category is selected
    if (!category) {
      return h('div', { className: classNameWrapper }, 
        h('p', { style: { color: '#798291', fontSize: '14px', fontStyle: 'italic' } }, 'Please select a category above first.')
      );
    }

    // 4. UI logic for categories with no defined subcategories
    if (options.length === 0) {
      return h('div', { className: classNameWrapper }, 
        h('p', { style: { color: '#798291', fontSize: '14px' } }, `No subcategories available for "${category}"`)
      );
    }

    // 5. Render the select dropdown
    return h('select', {
      id: forID,
      className: classNameWrapper,
      value: value || '',
      onChange: (e) => onChange(e.target.value),
      style: { 
        width: '100%', 
        padding: '10px', 
        borderRadius: '4px', 
        border: '1px solid #dfdfe3',
        backgroundColor: '#fff'
      }
    },
      [
        h('option', { value: '', key: 'placeholder' }, '-- Select a Subcategory --'),
        ...options.map(opt => h('option', { value: opt, key: opt }, opt))
      ]
    );
  }
});
 
      const DependentSelectPreview = createClass({
        render() {
          return h('span', {}, this.props.value || '');
        }
      });
 
      CMS.registerWidget(
        'dependent-select',
        DependentSelectControl,
        DependentSelectPreview
      );
    </script>
  </body>
</html>
