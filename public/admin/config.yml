backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "antiques"
    label: "Antiques"
    folder: "src/content/antiques"
    create: true
    slug: "{{slug}}"

    fields:
      - { label: "Name", name: "title", widget: "string" }

      - { label: "Description", name: "description", widget: "text" }

      - { label: "Category", name: "category", widget: "select",
          options: ["Антикварни часовници", "Порцелан", "Старинни бижута", "Изобразително изкуство", "Колекционерски предмети","Етника и Фолклор","Книги",Сувенири и Подараци","Военни предмети"] }

      - { label: "Subcategory", name: "subcategory", widget: "dependent-select" }

      - { label: "Price", name: "price", widget: "number" }

      - { label: "Featured", "name": "featured", widget: "boolean"}

      - { label: "Available", "name": "available", widget: "boolean"}

      - { label: "New", "name": "new", widget: "boolean"}
      
      - label: "Images"
        name: "images"
        widget: "list"
        fields:
          - { label: "Image", name: "url", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }