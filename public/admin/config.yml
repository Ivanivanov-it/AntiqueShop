backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "antiques"
    label: "Antiques"
    folder: "src/content/antiques"
    create: true
    slug: "{{slug}}"

    fields:
      - { label: "Име", name: "title", widget: "string" }

      - { label: "Описание", name: "description", widget: "text" }

      - { label: "Категория", name: "category", widget: "select",
          options: ["Антикварни часовници", "Порцелан", "Старинни бижута", "Изобразително изкуство", "Колекционерски предмети","Етника и Фолклор","Книги","Сувенири и Подараци","Военни предмети"] }

      - { label: "Подкатегория", name: "subcategory", widget: "dependent-select" }

      - { label: "Цена", name: "price", widget: "number" }

      - { label: "Препоръчан", "name": "featured", widget: "boolean"}

      - { label: "Наличен", "name": "available", widget: "boolean"}

      - { label: "Нов", "name": "new", widget: "boolean"}
      
      - label: "Снимки"
        name: "images"
        widget: "list"
        fields:
          - { label: "Снимка", name: "url", widget: "image" }
          - { label: "Описание", name: "caption", widget: "string", required: false }